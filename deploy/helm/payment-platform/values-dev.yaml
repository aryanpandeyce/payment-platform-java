  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "192Mi"
    limits:
      cpu: "300m"
      memory: "384Mi"

fraudService:
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "192Mi"
    limits:
      cpu: "300m"
      memory: "384Mi"

notificationService:
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "192Mi"
    limits:
      cpu: "300m"
      memory: "384Mi"

apiGateway:

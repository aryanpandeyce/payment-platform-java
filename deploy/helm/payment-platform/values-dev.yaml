# Development environment configuration for local kind cluster
global:
  imageTag: "latest"
  imagePullPolicy: "Never" # Loads directly from local Docker daemon into kind
  registry: "apexpay"

infra:
  deployStateful: true

ingress:
  enabled: true
  host: "localhost"

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

identityService:
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "192Mi"
    limits:
      cpu: "300m"
      memory: "384Mi"

accountService:
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "192Mi"
    limits:
      cpu: "300m"
      memory: "384Mi"


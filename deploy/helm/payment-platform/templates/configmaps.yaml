apiVersion: v1
kind: ConfigMap
metadata:
  name: apexpay-config
  labels:
    {{- include "payment-platform.labels" . | nindent 4 }}
data:
  DB_POSTGRES_HOST: {{ .Values.infra.postgres.host | quote }}
  DB_POSTGRES_PORT: {{ .Values.infra.postgres.port | quote }}
  DB_POSTGRES_USER: {{ .Values.infra.postgres.username | quote }}
  MONGO_HOST: {{ .Values.infra.mongo.host | quote }}
  MONGO_PORT: {{ .Values.infra.mongo.port | quote }}
  MONGO_USER: {{ .Values.infra.mongo.username | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.infra.kafka.bootstrapServers | quote }}
  FRAUD_MAX_AMOUNT: {{ .Values.fraudService.maxAmount | quote }}
  FRAUD_MAX_VELOCITY: {{ .Values.fraudService.maxVelocity | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.apiGateway.corsAllowedOrigins | quote }}

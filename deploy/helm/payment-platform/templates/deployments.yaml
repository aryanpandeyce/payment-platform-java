{{/*
Deployments for ApexPay Microservices and Frontend
*/}}
{{- if .Values.identityService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app.kubernetes.io/name: identity-service
    {{- include "payment-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.identityService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
        {{- include "payment-platform.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-service
          image: "{{ .Values.global.registry }}/{{ .Values.identityService.image }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.identityService.port }}
              name: http
          securityContext:
            {{- include "payment-platform.securityContext" . | nindent 12 }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.identityService.port | quote }}
            - name: DB_URL
              value: "jdbc:postgresql://{{ .Values.infra.postgres.host }}:{{ .Values.infra.postgres.port }}/identity_db"
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: apexpay-config
                  key: DB_POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infra.postgres.passwordSecretName }}
                  key: {{ .Values.infra.postgres.passwordSecretKey }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infra.jwt.secretName }}
                  key: {{ .Values.infra.jwt.secretKey }}
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apexpay-secrets
                  key: SEED_ADMIN_PASSWORD
            - name: SEED_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apexpay-secrets
                  key: SEED_USER_PASSWORD
          resources:
            {{- toYaml .Values.identityService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.identityService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.identityService.port }}
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
{{- end }}

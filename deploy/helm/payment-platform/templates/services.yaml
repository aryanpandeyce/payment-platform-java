{{/*
ClusterIP Services for ApexPay
*/}}
{{- if .Values.identityService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  labels:
    app.kubernetes.io/name: identity-service
    {{- include "payment-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.identityService.port }}
      targetPort: {{ .Values.identityService.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: identity-service
---
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: apexpay-secrets
  labels:
    {{- include "payment-platform.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ default "root" .Values.secrets.postgresPassword | b64enc | quote }}
  MONGO_PASSWORD: {{ default "change_me" .Values.secrets.mongoPassword | b64enc | quote }}
  JWT_SECRET: {{ default "supersecretjwtkeythatisatleast256bitslongforhmacsha256signing" .Values.secrets.jwtSecret | b64enc | quote }}
  SEED_ADMIN_PASSWORD: {{ default "Admin@ApexPay2026!" .Values.secrets.seedAdminPassword | b64enc | quote }}
  SEED_USER_PASSWORD: {{ default "User@ApexPay2026!" .Values.secrets.seedUserPassword | b64enc | quote }}

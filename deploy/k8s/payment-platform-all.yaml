apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels:
    app.kubernetes.io/name: identity-service
    helm.sh/chart: payment-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: apexpay-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
        helm.sh/chart: payment-platform-0.1.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: apexpay-platform
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-service
          image: "apexpay/identity-service:latest"
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
              name: http
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/identity_db"
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: apexpay-config
                  key: DB_POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apexpay-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: apexpay-secrets
                  key: JWT_SECRET
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apexpay-secrets
                  key: SEED_ADMIN_PASSWORD
            - name: SEED_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apexpay-secrets
                  key: SEED_USER_PASSWORD
          resources:
            limits:
              cpu: 300m
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}

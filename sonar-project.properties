# ==============================================================================
# SonarQube Multi-Module Analysis Configuration
# ==============================================================================

sonar.projectKey=payment-platform-java
sonar.projectName=payment-platform-java
sonar.projectVersion=0.0.1-SNAPSHOT
sonar.sourceEncoding=UTF-8
sonar.java.source=21

# Multi-Module project topology
sonar.modules=common,identity-service,account-service,payment-service,fraud-service,notification-service,api-gateway

# Source & Test paths per module
common.sonar.sources=src/main/java
common.sonar.tests=src/test/java

identity-service.sonar.sources=src/main/java
identity-service.sonar.tests=src/test/java

account-service.sonar.sources=src/main/java
account-service.sonar.tests=src/test/java

payment-service.sonar.sources=src/main/java
payment-service.sonar.tests=src/test/java

fraud-service.sonar.sources=src/main/java
fraud-service.sonar.tests=src/test/java

notification-service.sonar.sources=src/main/java
notification-service.sonar.tests=src/test/java

api-gateway.sonar.sources=src/main/java
api-gateway.sonar.tests=src/test/java

# Exclusions from coverage (generated configs, seed scripts, DTOs, migrations)
sonar.coverage.exclusions=\
  **/dto/**,\
  **/seed/**,\
  **/config/**,\
  **/db/migration/**,\
  **/*Application.java

# JaCoCo XML execution report paths
sonar.coverage.jacoco.xmlReportPaths=\
  common/target/site/jacoco/jacoco.xml,\
  identity-service/target/site/jacoco/jacoco.xml,\
  account-service/target/site/jacoco/jacoco.xml,\
  payment-service/target/site/jacoco/jacoco.xml,\
  fraud-service/target/site/jacoco/jacoco.xml,\
  notification-service/target/site/jacoco/jacoco.xml,\
  api-gateway/target/site/jacoco/jacoco.xml

# Quality Gate Thresholds
# 1. Coverage on New Code: >= 70.0%
# 2. New Vulnerabilities / Bugs: 0
# 3. Code Duplication: <= 3.0%
# 4. Security Hotspots Reviewed: 100%
sonar.qualitygate.wait=true

# ==============================================================================
# Dependabot Configuration for Automated Dependency Updates
# ==============================================================================

version: 2
updates:
  # 1. Maven Multi-Module Java Dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    reviewers:
      - "aryanpandeyce"
    commit-message:
      prefix: "chore(deps)"

  # 2. React / Vite Frontend NPM Dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    reviewers:
      - "aryanpandeyce"
    commit-message:
      prefix: "chore(deps-frontend)"

  # 3. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"

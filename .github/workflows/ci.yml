name: CI/CD Pipeline & GitHub Pages Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  backend-test:
    name: Build & Test Java Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [account-service, payment-service, fraud-service, notification-service, api-gateway]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          chmod +x ../mvnw || true
          ../mvnw test -B
        env:
          JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"

  frontend-build:
    name: Build Frontend (Mock Mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React Dashboard (Mock Mode Enabled)
        run: npm run build
        env:
          VITE_USE_MOCK: "true"

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

  deploy-pages:
    name: Deploy Mock Dashboard to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

server:
  # API Gateway port 8090 as per SSD/specs
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Route 0a: Identity Service Auth (Port 8084)
        - id: identity-service-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/auth/**

        # Route 0b: Identity Service Users (Port 8084)
        - id: identity-service-users
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/users/**

        # Route 1: Account Service (Port 8085)
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/accounts/**

        # Route 2: Payment Service (Port 8086)
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/payments/**

        # Route 3: Notification Service / Audit Logs (Port 8088)
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/audit-logs/**

jwt:
  secret: ${JWT_SECRET:supersecretjwtkeythatisatleast256bitslongforhmacsha256signing}
  expiration-ms: 86400000 # 24 hours

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true

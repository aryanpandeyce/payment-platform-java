server:
  # Account service port (default 8085 as per SSD/specs)
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: account-service

  datasource:
    # PostgreSQL connection URL (Docker container 5433 port pe map hai)
    url: ${DB_URL:jdbc:postgresql://localhost:5433/account_db}
    # DB username environment variable se aayega, default "payments" rahega
    username: ${DB_USERNAME:payments}
    # DB password environment variable se aayega
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    # SQL queries console pe dikhane ke liye
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-SYSTEM}] %-5level %logger{36} - %msg%n"


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        # Actuator endpoints open taaki health status check kar sakein
        include: health,info
  endpoint:
    health:
      show-details: always

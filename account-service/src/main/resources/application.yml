server:
  # Account service port (default 8085 as per SSD/specs)
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: account-service

  datasource:
    # PostgreSQL connection URL (Docker container 5433 port pe map hai)
    url: ${DB_URL:jdbc:postgresql://localhost:5433/account_db}
    # DB username environment variable se aayega, default "payments" rahega
    username: ${DB_USERNAME:payments}
    # DB password environment variable se aayega
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    # SQL queries console pe dikhane ke liye
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      # ddl-auto update: Learning ke liye tables automatically ban jayengi/update ho jayengi.
      # Production me Flyway/Liquibase migration scripts use karte hain.
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        # Actuator endpoints open taaki health status check kar sakein
        include: health,info
  endpoint:
    health:
      show-details: always

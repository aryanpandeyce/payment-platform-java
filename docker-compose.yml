services:
  # 1. PostgreSQL (Accounts, Payments, and Identity databases)
  postgres:
    image: postgres:16.8-alpine
    container_name: apexpay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payments} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 2. MongoDB (Immutable audit trail)
  mongo:
    image: mongo:7.0.17
    container_name: apexpay-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-audit}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change_me}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 3. Apache Kafka (KRaft mode with internal & external listeners)
  kafka:
    image: apache/kafka:3.9.0
    container_name: apexpay-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # 4. Identity Service (Port 8084)
  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: apexpay-identity-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: ${POSTGRES_USER:-payments}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeythatisatleast256bitslongforhmacsha256signing}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@ApexPay2026!}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-User@ApexPay2026!}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 5. Account Service (Port 8085)
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: apexpay-account-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/account_db
      DB_USERNAME: ${POSTGRES_USER:-payments}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # 6. Payment Service (Port 8086)
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: apexpay-payment-service
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: ${POSTGRES_USER:-payments}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # 7. Fraud Service (Port 8087)
  fraud-service:
    build:
      context: .
      dockerfile: fraud-service/Dockerfile
    container_name: apexpay-fraud-service
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRAUD_MAX_AMOUNT: ${FRAUD_MAX_AMOUNT:-50000.00}
      FRAUD_MAX_VELOCITY: ${FRAUD_MAX_VELOCITY:-5}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # 8. Notification & Audit Service (Port 8088)
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: apexpay-notification-service
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: mongodb://${MONGO_USER:-audit}:${MONGO_PASSWORD:-change_me}@mongo:27017/audit_db?authSource=admin
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # 9. API Gateway (Port 8090)
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: apexpay-api-gateway
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      IDENTITY_SERVICE_URL: http://identity-service:8084
      ACCOUNT_SERVICE_URL: http://account-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8088
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeythatisatleast256bitslongforhmacsha256signing}
    depends_on:
      identity-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    restart: unless-stopped

  # 10. React Frontend Dashboard (Port 5173)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apexpay-frontend
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
